[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[project]
name = "dadi-db-exports"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "amsterdam-schema-tools==9.10.1",
    "azure-identity==1.26.0",
    "azure-storage-blob==12.31.0",
    "backoff==2.2.1",
    "django-environ==0.14.0",
    "psycopg==3.3.4",
    "requests==2.34.2",
    "SQLAlchemy==2.0.50",
    "zipfly==6.0.5",
]

[dependency-groups]
dev = [
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-sugar==1.1.1",
    "requests-mock==1.12.1",
    "ruff==0.17.0",
    "termcolor==3.3.0",
    "ty>=0.0.69",
]

[tool.uv.build-backend]
module-name = "exports"
