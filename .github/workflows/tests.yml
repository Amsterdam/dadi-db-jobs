name: tests

permissions:
  contents: read

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exports
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.14'
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        cache-dependency-glob: exports/uv.lock
    - name: Install PostgreSQL runtime library
      run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq5
    - name: Run tests with coverage
      run: uv run --locked --group dev pytest
